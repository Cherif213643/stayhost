version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: stayhost_postgres
    restart: always
    environment:
      POSTGRES_USER: stayhost_admin
      POSTGRES_PASSWORD: super_secret_password_123
      POSTGRES_DB: stayhost_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
